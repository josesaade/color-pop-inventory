<script>
/* piel antes del primer pintado: auto = casino 6:00-18:00, rueda el resto */

<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  /* Dos pieles sobre la misma lógica: casino (día, por defecto) y rueda (noche). data-skin en <html>. */
  :root{
    --bg:#0F3B2E;--bg2:#0A2A20;--bg3:#17493A;--fg:#F3E7D0;--mute:#CFC3A5;
    --card:#F3E7D0;--cfg:#1A1A1A;--cmute:#5B5444;--acc:#E3B04B;--accfg:#1A1A1A;
    --alt:#C8342B;--altfg:#F3E7D0;--line:rgba(243,231,208,.18);--tabs:rgba(0,0,0,.25);
    --dsp:'Bagel Fat One','Arial Rounded MT Bold',system-ui,sans-serif;
    --body:'Space Grotesk',system-ui,sans-serif;
  }
  :root[data-skin="rueda"]{
    --bg:#0C0E14;--bg2:#0C0E14;--bg3:#0C0E14;--fg:#E9E6DD;--mute:#8F9099;
    --card:#171A24;--cfg:#E9E6DD;--cmute:#8F9099;--acc:#5FD3C2;--accfg:#06201C;
    --alt:#F26B5B;--altfg:#fff;--line:rgba(233,230,221,.12);--tabs:#171A24;
    --dsp:'Unbounded',system-ui,sans-serif;--body:'Manrope',system-ui,sans-serif;
  }
  html,body{height:100%;background:var(--bg);color:var(--fg);font-family:var(--body);-webkit-font-smoothing:antialiased;overflow:hidden;}
  body{background:radial-gradient(120% 70% at 50% 0%,var(--bg3),var(--bg) 55%,var(--bg2));background-attachment:fixed;}
  .app{height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
  header{padding:16px 18px 10px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .header-title{font-family:var(--dsp);font-size:30px;font-weight:400;line-height:1;color:var(--acc);letter-spacing:.02em;text-transform:uppercase;}
  .header-sub{display:none;font-size:11px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase;margin-top:4px;}
  :root[data-skin="rueda"] .header-title{font-size:22px;font-weight:700;color:var(--fg);letter-spacing:0;}
  :root[data-skin="rueda"] .header-sub{display:block;}
  .skin-btn{margin-left:auto;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--tabs);border:1px solid var(--line);border-radius:99px;padding:0 14px;min-height:36px;white-space:nowrap;}
  .sync-dot{width:10px;height:10px;border-radius:50%;background:#555;flex-shrink:0;transition:background .3s,box-shadow .3s;}
  .sync-dot.ok{background:#58C27D;box-shadow:0 0 0 4px rgba(88,194,125,.2);}
  .sync-dot.err{background:#E0574A;box-shadow:0 0 0 4px rgba(224,87,74,.2);}
  .tabs{display:flex;gap:2px;margin:0 14px 12px;padding:5px;background:var(--tabs);border-radius:99px;flex-shrink:0;}
  .tab{flex:1;text-align:center;padding:0 4px;min-height:44px;display:flex;align-items:center;justify-content:center;border-radius:99px;font-size:13px;color:var(--fg);cursor:pointer;}
  .tab.active{background:var(--card);color:var(--cfg);font-weight:700;}
  :root[data-skin="rueda"] .tab.active{background:var(--acc);color:var(--accfg);}

  /* ── rotación / sport ── */
  .rot-view{flex:1;overflow-y:auto;padding:4px 14px 24px;}
  .rot-card{background:var(--card);color:var(--cfg);border-radius:16px;padding:12px 14px;margin-bottom:9px;display:flex;align-items:center;gap:12px;}
  .rot-dot{width:28px;height:28px;border-radius:50%;flex-shrink:0;border:3px dashed rgba(255,255,255,.7);}
  :root[data-skin="rueda"] .rot-dot{width:14px;height:14px;border:1px solid rgba(233,230,221,.35);}
  .rot-body{flex:1;min-width:0;}
  .rot-name{font-weight:700;font-size:14px;}
  .rot-freq{font-size:11.5px;color:var(--cmute);margin-top:2px;}
  .rot-last{font-size:11px;color:var(--cmute);margin-top:3px;}
  .rot-status{font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px;flex-shrink:0;white-space:nowrap;}
  .rot-status.ok{background:#58C27D;color:#0B2A17;}
  .rot-status.rezagado{background:#E0574A;color:#fff;}
  .rot-status.repetido{background:#E3B04B;color:#2B1F00;}
  .rot-foot{padding:10px 4px 4px;font-size:11px;color:var(--mute);line-height:1.5;}

  /* ── disponibles: fichas (casino) / disco (rueda) ── */
  .grid{flex:1;overflow-y:auto;padding:4px 14px 16px;display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:start;}
  .grid.ring-mode{display:block;}
  .card{background:var(--card);color:var(--cfg);border-radius:22px;padding:14px 12px 12px;display:grid;gap:8px;justify-items:center;text-align:center;cursor:pointer;animation:fadeUp .4s both;transition:transform .15s;}
  .card:active{transform:scale(.97);}
  .card.zero{opacity:.55;background:repeating-linear-gradient(135deg,var(--card) 0 8px,#E0CFAA 8px 16px);}
  .chip{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;font-family:var(--dsp);font-size:30px;border:5px dashed rgba(255,255,255,.7);box-shadow:0 0 0 4px var(--c);background:var(--c);color:var(--ci);}
  .card-name{font-weight:700;font-size:13px;line-height:1.15;}
  .card-label{font-size:11px;color:var(--cmute);}
  .bar-wrap{height:8px;width:100%;background:rgba(26,26,26,.14);border-radius:99px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:99px;background:var(--c);transition:width .8s cubic-bezier(.16,1,.3,1);}
  .ringwrap{position:relative;width:100%;max-width:290px;margin:0 auto 14px;aspect-ratio:1;}
  .ringwrap svg{width:100%;height:100%;display:block;overflow:visible;}
  .seg{cursor:pointer;transition:stroke-width .2s;}
  .seg:hover,.seg:focus{stroke-width:30;}
  .ctr{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none;}
  .ctr b{font-family:var(--dsp);font-size:56px;line-height:1;color:var(--acc);font-weight:700;}
  .ctr span{font-size:12px;color:var(--mute);}
  .llist{display:grid;gap:8px;}
  .lrow{display:grid;grid-template-columns:14px 1fr 80px 26px;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--card);color:var(--cfg);font-size:13px;cursor:pointer;}
  .lrow small{color:var(--cmute);font-size:11px;}
  .lrow .d{width:14px;height:14px;border-radius:50%;background:var(--c);}
  .lrow .bar{height:6px;border-radius:99px;background:rgba(233,230,221,.12);overflow:hidden;}
  .lrow .bar i{display:block;height:100%;border-radius:99px;background:var(--c);}
  .lrow b{text-align:right;font-weight:800;}
  .lrow.zero{opacity:.5;}
  .total-bar{margin:8px 14px 10px;padding:12px 20px;background:var(--acc);color:var(--accfg);border-radius:99px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .total-label{font-weight:700;font-size:14px;}
  .total-sub{font-size:11.5px;opacity:.8;}
  .total-val{margin-left:auto;font-family:var(--dsp);font-size:30px;line-height:1;font-weight:400;}
  :root[data-skin="rueda"] .total-bar{display:none!important;}

  .loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:var(--bg);z-index:10;transition:opacity .4s;}
  .loading.hide{opacity:0;pointer-events:none;}
  .loading-text{font-size:12px;color:var(--mute);letter-spacing:.1em;text-transform:uppercase;}
  .spinner{width:24px;height:24px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}

  /* ── hoja de outfits ── */
  .sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;opacity:0;pointer-events:none;transition:opacity .3s;}
  .sheet-overlay.show{opacity:1;pointer-events:all;}
  .sheet{position:fixed;bottom:0;left:0;right:0;background:var(--bg);color:var(--fg);border-radius:28px 28px 0 0;z-index:101;max-height:86dvh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .35s cubic-bezier(.16,1,.3,1);}
  .sheet.show{transform:translateY(0);}
  .sheet-handle{width:36px;height:4px;border-radius:2px;background:var(--line);margin:14px auto 0;flex-shrink:0;}
  .sheet-header{padding:14px 18px 12px;display:flex;align-items:center;gap:12px;flex-shrink:0;border-bottom:1px solid var(--line);}
  .sheet-dot{width:18px;height:18px;border-radius:50%;flex-shrink:0;border:3px dashed rgba(255,255,255,.7);}
  .sheet-title{font-family:var(--dsp);font-size:22px;font-weight:400;line-height:1.1;flex:1;}
  :root[data-skin="rueda"] .sheet-title{font-size:17px;font-weight:700;}
  .sheet-count{font-size:12px;color:var(--mute);}
  .sheet-body{overflow-y:auto;padding:12px 14px calc(16px + env(safe-area-inset-bottom,0px));}
  .sheet-empty{padding:40px 20px;text-align:center;font-size:12px;color:var(--mute);letter-spacing:.1em;text-transform:uppercase;}
  .ocard{background:var(--card);color:var(--cfg);border-radius:20px;padding:12px;margin-bottom:10px;}
  .ocard-top{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
  .ocard-thumb{width:56px;height:76px;border-radius:10px;object-fit:cover;background:rgba(128,128,128,.25);flex-shrink:0;display:block;}
  .ocard-thumb-placeholder{width:56px;height:76px;border-radius:10px;background:rgba(128,128,128,.25);flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .ocard-id{font-family:var(--dsp);font-size:24px;font-weight:400;line-height:1;}
  :root[data-skin="rueda"] .ocard-id{font-size:18px;font-weight:700;}
  .ocard-cat{font-size:12px;color:var(--cmute);margin-top:4px;}
  .ocard-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .pitem{background:rgba(128,128,128,.14);border-radius:12px;padding:8px;display:flex;align-items:center;gap:8px;min-width:0;}
  .pitem-swatch{width:40px;height:40px;border-radius:8px;object-fit:cover;flex-shrink:0;border:.5px solid rgba(128,128,128,.3);}
  .pitem-body{min-width:0;}
  .pitem-lbl{font-size:9.5px;color:var(--cmute);letter-spacing:.08em;text-transform:uppercase;}
  .pitem-val{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pitem-sub{font-size:10px;color:var(--cmute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* ── panel de lavado ── */
  .wash-panel{margin:0 14px 12px;background:var(--alt);color:var(--altfg);border:5px solid var(--acc);border-radius:24px;flex-shrink:0;overflow:hidden;}
  :root[data-skin="rueda"] .wash-panel{background:var(--card);color:var(--fg);border:0;border-radius:20px;}
  .wash-header{display:flex;align-items:center;gap:14px;padding:12px 16px;cursor:pointer;min-height:44px;}
  #wash-gauge{display:none;flex:none;}
  :root[data-skin="rueda"] #wash-gauge{display:block;}
  .wash-days{font-family:var(--dsp);font-size:56px;font-weight:400;line-height:.9;color:var(--acc);}
  :root[data-skin="rueda"] .wash-days{font-size:44px;font-weight:700;}
  :root[data-skin="rueda"] .wash-days.u-mid{color:#E3B04B;}
  :root[data-skin="rueda"] .wash-days.u-hi{color:#F26B5B;}
  .wash-label{font-size:12px;opacity:.9;margin-top:4px;}
  .wash-chevron{margin-left:auto;font-size:18px;transition:transform .25s;}
  .wash-chevron.open{transform:rotate(180deg);}
  .bulbs{display:grid;grid-template-columns:repeat(20,1fr);gap:4px;padding:0 16px 12px;}
  .bulbs i{aspect-ratio:1;border-radius:50%;background:rgba(0,0,0,.28);}
  .bulbs i.on{background:var(--acc);box-shadow:0 0 8px var(--acc);}
  :root[data-skin="rueda"] .bulbs{display:none;}
  .wash-body{max-height:0;overflow:hidden;transition:max-height .3s ease;}
  .wash-body.open{max-height:380px;}
  .wash-row{display:flex;align-items:center;gap:10px;margin:0 12px 8px;padding:10px 12px;background:rgba(0,0,0,.2);border-radius:14px;font-size:12.5px;}
  :root[data-skin="rueda"] .wash-row{background:rgba(255,255,255,.04);}
  .wash-cat-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;border:1px solid rgba(255,255,255,.5);}
  .wash-cat-name{font-weight:700;width:76px;flex-shrink:0;}
  .wash-cat-count{flex:1;opacity:.9;font-size:11.5px;}
  .wash-status{font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px;flex-shrink:0;white-space:nowrap;}
  .wash-status.ok{background:#58C27D;color:#0B2A17;}
  .wash-status.tight{background:#E3B04B;color:#2B1F00;}
  .wash-status.risk{background:#1A1A1A;color:#FFB3AB;}
  .wash-status.na{background:rgba(0,0,0,.3);color:inherit;}
  :root[data-skin="rueda"] .wash-status.risk{background:#E0574A;color:#fff;}
  :root[data-skin="rueda"] .wash-status.na{background:rgba(128,128,128,.3);}
  .wash-foot{padding:2px 16px 14px;font-size:11px;opacity:.75;line-height:1.4;}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>

    <div class="sheet-title" id="sheet-title"></div>
    <div class="sheet-count" id="sheet-count"></div>
  </div>
  <div class="sheet-body" id="sheet-body"></div>
</div>

let allOutfits=[];

function esSS(id){return (id||'').substring(0,2)==='SS';}
function getCat(id){return CATS[id.substring(0,2)]||'';}

let lastConfig=null, lastHistorial=[];

async function load(){
  const dot=document.getElementById('sync-dot');
  const H={'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY};
  try{
    const [rOutfits, rHistorial, rPrendas, rConfig] = await Promise.all([
      fetch(`${SB_URL}/rest/v1/outfits?select=id,usado,rating,enfoque,derogado&order=id.asc`,{headers:H}),
      fetch(`${SB_URL}/rest/v1/historial?select=outfit_id,enfoque,fecha&order=fecha.desc`,{headers:H}),
      fetch(`${SB_URL}/rest/v1/prendas?select=codigo,tipo,subtipo,marca,color,modelo,outfit_id`,{headers:H}),
      fetch(`${SB_URL}/rest/v1/config?select=ultimo_lavado,proximo_lavado,meta_dias`,{headers:H})
    ]);
    if(!rOutfits.ok) throw new Error('fetch failed');
    const rowsAll=await rOutfits.json();
    // Variantes (WW08V2…): comparten camiseta con el base; en rotación/stats se cuentan como el base.
    const baseDeCP=id=>(id||'').replace(/(?<=\d)V\d+$/,'');
    const esVarCP=id=>/^[A-Z]{2}\d+V\d+$/.test(id||'');
    const rows=rowsAll.filter(r=>!r.derogado&&!esVarCP(r.id)); // los derogados y las variantes no se listan
    const histRows=await rHistorial.json();
    histRows.forEach(h=>{h.outfit_id=baseDeCP(h.outfit_id);});
    if(!rows.length) throw new Error('no data');

    // Construir mapa outfit_id → enfoque desde historial + mapa hardcodeado como fallback
    const enfFromHist={};
    histRows.forEach(h=>{ if(!enfFromHist[h.outfit_id]) enfFromHist[h.outfit_id]=h.enfoque; });

    allOutfits=rows.map(row=>{
      const meta=OUTFITS_MAP[row.id];
      // Si no está en el mapa hardcodeado, usar el enfoque de Supabase directamente
      const e=enfFromHist[row.id]||(meta?.e)||row.enfoque||'Silver Chariot';
      return{id:row.id, usado:row.usado, nombre:meta?.nombre||row.id, e};
    }).filter(o=>o.e);
    lastHistorial=histRows;

    // PRENDAS_MAP_CP para tarjetas estructuradas
    PRENDAS_MAP_CP={};
    if(rPrendas.ok){
      const prendaRows=await rPrendas.json();
      prendaRows.sort((a,b)=>(a.codigo||'').localeCompare(b.codigo||''));
      prendaRows.forEach(p=>{
        if(!p.outfit_id) return;
        p.outfit_id.split(',').map(s=>s.trim()).filter(Boolean).forEach(oid=>{
          if(!PRENDAS_MAP_CP[oid]) PRENDAS_MAP_CP[oid]={};
          let key=p.tipo;
          if(key==='camiseta_dep') key='camisa'; else if(key==='pantaloneta_dep') key='pantalon'; else if(key==='medias_dep') key='medias';
          if(key==='pulsera'&&PRENDAS_MAP_CP[oid].pulsera) key=PRENDAS_MAP_CP[oid].pulsera2?'pulsera3':'pulsera2';
          PRENDAS_MAP_CP[oid][key]={codigo:p.codigo,subtipo:p.subtipo,marca:p.marca,color:p.color,modelo:p.modelo};
        });
      });
    }

    // Config de ciclo de lavado
    if(rConfig.ok){
      const cfgRows=await rConfig.json();
      lastConfig=cfgRows[0]||null;
    }

    dot.className='sync-dot ok';
    // Los outfits deportivos (SS) quedan fuera de disponibles, lavado y rotación: tienen su propia vista
    const regulares=allOutfits.filter(o=>!esSS(o.id));
    const histReg=lastHistorial.filter(h=>!esSS(h.outfit_id));
    render(regulares);
    renderWash(regulares, histReg, lastConfig);
    renderRotacion(regulares, histReg, lastConfig);
    renderSport(allOutfits.filter(o=>esSS(o.id)), lastHistorial.filter(h=>esSS(h.outfit_id)));
  }catch(e){
    dot.className='sync-dot err';
    showError();
  }
  document.getElementById('loading').classList.add('hide');
}

let lastRegulares=null;
const lumCP=h=>{const n=parseInt(h.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;return(.299*r+.587*g+.114*b)/255;};
const inkCP=h=>lumCP(h)>.58?'#151515':'#FFFFFF';
const liftCP=h=>{if(lumCP(h)>.28)return h;const n=parseInt(h.slice(1),16);const m=v=>Math.round(v+(255-v)*.45).toString(16).padStart(2,'0');return'#'+m(n>>16)+m(n>>8&255)+m(n&255);};
function render(outfits){
  lastRegulares=outfits;
  const disp={},total={};
  Object.keys(ENFOQUES).forEach(e=>{disp[e]=0;total[e]=0;});
  outfits.forEach(o=>{
    if(!ENFOQUES[o.e]) return;
    total[o.e]=(total[o.e]||0)+1;
    if(!o.usado) disp[o.e]=(disp[o.e]||0)+1;
  });
  const totalDisp=Object.values(disp).reduce((a,b)=>a+b,0);
  const totalAll=outfits.length;
  const sorted=Object.keys(ENFOQUES).filter(e=>e!=='Entrenamiento').sort((a,b)=>disp[b]-disp[a]);
  const grid=document.getElementById('grid');
  const ring=document.documentElement.dataset.skin==='rueda';
  const q=e=>e.replace(/'/g,"\\'");
  grid.classList.toggle('ring-mode',ring);
  if(!ring){
    grid.innerHTML=sorted.map((e,i)=>{
      const c=ENFOQUES[e].color;
      const d=disp[e]||0, t=total[e]||0;
      const pct=t>0?Math.round((d/t)*100):0;
      return`<div class="card${d===0?' zero':''}" style="--c:${c};--ci:${inkCP(c)};animation-delay:${i*0.04}s" onclick="openSheet('${q(e)}')">
        <div class="chip">${d}</div>
        <div class="card-name">${e}</div>
        <div class="card-label">${ENFOQUES[e].label} · ${t} total · ${pct}%</div>
        <div class="bar-wrap"><div class="bar-fill" style="width:${pct}%"></div></div>
      </div>`;
    }).join('');
  } else {
    const R=100,C=2*Math.PI*R,gap=3;let off=0;
    const segs=sorted.filter(e=>disp[e]>0).map(e=>{
      const len=disp[e]/totalDisp*C;
      const t=`<circle class="seg" role="button" aria-label="${e}: ${disp[e]} disponibles" onclick="openSheet('${q(e)}')" cx="150" cy="150" r="${R}" fill="none" stroke="${liftCP(ENFOQUES[e].color)}" stroke-width="24" stroke-dasharray="${Math.max(len-gap,1).toFixed(2)} ${(C-len+gap).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 150 150)"/>`;
      off+=len;return t;
    }).join('');
    const rows=sorted.map(e=>{
      const c=liftCP(ENFOQUES[e].color);
      const d=disp[e]||0, t=total[e]||0;
      const pct=t>0?Math.round((d/t)*100):0;
      return`<div class="lrow${d===0?' zero':''}" style="--c:${c}" onclick="openSheet('${q(e)}')"><span class="d"></span><span>${e}<br><small>${ENFOQUES[e].label}</small></span><span class="bar"><i style="width:${pct}%"></i></span><b>${d}</b></div>`;
    }).join('');
    grid.innerHTML=`<div class="ringwrap"><svg viewBox="0 0 300 300"><circle cx="150" cy="150" r="${R}" fill="none" stroke="rgba(233,230,221,.08)" stroke-width="24"/>${segs}</svg><div class="ctr"><b>${totalDisp}</b><span>disponibles de ${totalAll}</span></div></div><div class="llist">${rows}</div>`;
  }
  document.getElementById('total-bar').style.display='flex';
  document.getElementById('total-val').textContent=totalDisp;
  document.getElementById('total-sub').textContent=`de ${totalAll} outfits`;
}

}

// ── rotación de enfoques ──
// Meta: que cada paleta de color se use ~1 vez por cada uno de sus outfits
// a lo largo del ciclo de lavado (meta_dias). Si tiene N outfits, el intervalo
// ideal entre usos de esa paleta es meta_dias/N días.
function renderRotacion(outfits, historial, cfg){
  const el=document.getElementById('view-rotacion');
  const metaDias=(cfg&&cfg.meta_dias)||60;
  const hoy=new Date().toISOString().slice(0,10);

  const counts={};
  Object.keys(ENFOQUES).forEach(e=>counts[e]=0);
  outfits.forEach(o=>{ if(ENFOQUES[o.e]!==undefined) counts[o.e]=(counts[o.e]||0)+1; });

  const filas=Object.keys(ENFOQUES).map(e=>{
    const n=counts[e]||0;
    if(n===0) return null; // sin outfits en esta paleta todavía, no aplica

    const intervalo=Math.max(1,Math.round(metaDias/n));
    const mensualRaw=30/intervalo;
    const mensual=Math.round(mensualRaw*10)/10;
    const freqTxt = Math.abs(mensual-Math.round(mensual))<0.15 && mensual>=1
      ? `${Math.round(mensual)} ${Math.round(mensual)===1?'vez':'veces'} al mes`
      : `cada ${intervalo} días`;

    const usosEnfoque=historial.filter(h=>h.enfoque===e).sort((a,b)=>b.fecha.localeCompare(a.fecha));
    const ultimo=usosEnfoque[0]?.fecha||null;
    const diasDesde=ultimo?diffDias(hoy,ultimo):null;

    let statusClass='ok', statusLbl='al día';
    if(diasDesde===null){ statusClass='rezagado'; statusLbl='nunca usado'; }
    else if(diasDesde>intervalo*1.5){ statusClass='rezagado'; statusLbl='rezagado'; }
    else if(diasDesde<intervalo*0.4){ statusClass='repetido'; statusLbl='muy reciente'; }

    return {e,n,intervalo,freqTxt,diasDesde,statusClass,statusLbl};
  }).filter(Boolean);

  // Los más rezagados primero (nunca usado va arriba de todo)
  filas.sort((a,b)=>{
    const da=a.diasDesde===null?99999:a.diasDesde/a.intervalo;
    const db=b.diasDesde===null?99999:b.diasDesde/b.intervalo;
    return db-da;
  });

  el.innerHTML = filas.map(f=>{
    const c=ENFOQUES[f.e].color;
    const lastTxt = f.diasDesde===null?'nunca usado':(f.diasDesde===0?'usado hoy':`hace ${f.diasDesde} día${f.diasDesde===1?'':'s'}`);
    return `<div class="rot-card">
        <span class="rot-dot" style="background:${c};"></span>
        <div class="rot-body">
          <div class="rot-name">${f.e}</div>
          <div class="rot-freq">${f.n} outfit${f.n===1?'':'s'} · sugerido: ${f.freqTxt}</div>
          <div class="rot-last">${lastTxt}</div>
        </div>
        <span class="rot-status ${f.statusClass}">${f.statusLbl}</span>
      </div>`;
  }).join('') + `<div class="rot-foot">la frecuencia sugerida se calcula sobre tu meta de lavado actual (${metaDias} días) — mientras más outfits tenga una paleta, más seguido le "toca" salir para que ninguna se quede repitiendo ni rezagada.</div>`;
}

function diffDias(a,b){ // a,b: 'YYYY-MM-DD' → días (a-b)
  const da=new Date(a+'T00:00:00'), db=new Date(b+'T00:00:00');
  return Math.round((da-db)/86400000);
}

// Misma regla de categoría por día que catPorLogica() en Outfits App
// (Lun-Mar-Mié→FF, Jue→EE, Vie→alterna FF/EE por semana, Sáb→RR, Dom→WW).
// No incluye eventos de calendario (elegante/Colombia/Junior/festivo) porque
// Color Pop no consulta los iCal — es solo la base determinista por día.
function catPorDia(date){
  const dia=date.getDay();
  if(dia>=1&&dia<=3) return 'FF';
  if(dia===4) return 'EE';
  if(dia===5){
    const semana=Math.floor((date-new Date(date.getFullYear(),0,1))/(7*86400000));
    return semana%2===0?'FF':'EE';
  }
  if(dia===6) return 'RR';
  return 'WW';
}

// Cuenta cuántos días de cada categoría hay entre hoy (incluido) y proximoLavado (excluido)
function proyeccionPorDias(hoyStr,proximoStr){
  const proy={EE:0,FF:0,RR:0,WW:0};
  if(!proximoStr) return proy;
  let d=new Date(hoyStr+'T00:00:00');
  const fin=new Date(proximoStr+'T00:00:00');
  while(d<fin){
    const c=catPorDia(d);
    if(proy[c]!==undefined) proy[c]++;
    d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1);
  }
  return proy;
}

function renderWash(outfits, historial, cfg){
  const panel=document.getElementById('wash-panel');
  if(!cfg||!cfg.ultimo_lavado){ panel.style.display='none'; return; }
  panel.style.display='block';

  const hoy=new Date().toISOString().slice(0,10);
  const metaDias=cfg.meta_dias||20;
  // proximo_lavado manda porque se puede ajustar manualmente (adelantar/atrasar el ciclo);
  // solo si no existe se calcula desde último_lavado + meta_dias como respaldo.
  const proximoEfectivo=cfg.proximo_lavado||null;
  const diasRestantes=Math.max(0, proximoEfectivo?diffDias(proximoEfectivo,hoy):(metaDias-diffDias(hoy,cfg.ultimo_lavado)));

  document.getElementById('wash-days').textContent=diasRestantes;
  document.getElementById('wash-label').textContent=diasRestantes===1?'día para lavar':'días para lavar';
  document.getElementById('wash-days').className='wash-days'+(diasRestantes<=3?' u-hi':diasRestantes<=7?' u-mid':'');
  const frac=Math.min(1,Math.max(0,diasRestantes/metaDias));
  document.getElementById('wash-bulbs').innerHTML=Array.from({length:20},(_,k)=>`<i class="${k<Math.round(frac*20)?'on':''}"></i>`).join('');
  const gr=24,gc=2*Math.PI*gr;
  document.getElementById('wash-gauge').innerHTML=`<svg width="60" height="60" viewBox="0 0 60 60" aria-hidden="true"><circle cx="30" cy="30" r="${gr}" fill="none" stroke="rgba(233,230,221,.12)" stroke-width="7"/><circle cx="30" cy="30" r="${gr}" fill="none" stroke="#5FD3C2" stroke-width="7" stroke-linecap="round" stroke-dasharray="${(frac*gc).toFixed(1)} ${gc.toFixed(1)}" transform="rotate(-90 30 30)"/></svg>`;

  // disponibles/total por categoría
  const catStats={};
  Object.keys(CATS).forEach(c=>catStats[c]={disp:0,total:0});
  outfits.forEach(o=>{
    const c=o.id.substring(0,2);
    if(!catStats[c]) return;
    catStats[c].total++;
    if(!o.usado) catStats[c].disp++;
  });

  // proyección exacta por regla de día de la semana, para los días que faltan del ciclo
  const proy=proyeccionPorDias(hoy, proximoEfectivo);

  const body=document.getElementById('wash-body');
  body.innerHTML=Object.keys(CATS).filter(c=>c!=='SS').map(c=>{
    const s=catStats[c];
    const proyeccion=proy[c]||0;
    let statusClass='ok', statusLbl='alcanza';
    if(proyeccion>0){
      if(s.disp>=proyeccion){ statusClass='ok'; statusLbl='alcanza'; }
      else if(s.disp>=proyeccion*0.5){ statusClass='tight'; statusLbl='ajustado'; }
      else{ statusClass='risk'; statusLbl='no alcanza'; }
    } else {
      statusClass='na'; statusLbl='no se necesita';
    }
    return `<div class="wash-row">
        <span class="wash-cat-dot" style="background:${CATS_COLOR[c]}"></span>
        <span class="wash-cat-name">${CATS[c]}</span>
        <span class="wash-cat-count">${s.disp}/${s.total} disp${proyeccion>0?` · ${proyeccion} días proy.`:''}</span>
        <span class="wash-status ${statusClass}">${statusLbl}</span>
      </div>`;
  }).join('');
  body.innerHTML+=`<div class="wash-foot">proyección según la regla FF lun-mié · EE jue/vie · RR sáb · WW dom, hasta ${proximoEfectivo||'—'}</div>`;
}

let washOpen=false;
function toggleWash(){
  washOpen=!washOpen;
  document.getElementById('wash-body').classList.toggle('open',washOpen);
  document.getElementById('wash-chevron').classList.toggle('open',washOpen);
}

function openSheet(enfoque){
  const enf=ENFOQUES[enfoque];
  if(!enf) return;
  const disponibles=allOutfits.filter(o=>o.e===enfoque&&!o.usado);
  document.getElementById('sheet-dot').style.background=enf.color;
  document.getElementById('sheet-title').textContent=enfoque;
  document.getElementById('sheet-count').textContent=`${disponibles.length} disponibles`;
  const body=document.getElementById('sheet-body');
  if(!disponibles.length){
    body.innerHTML=`<div class="sheet-empty">sin outfits disponibles</div>`;
  } else {
    body.innerHTML=disponibles.map(o=>outfitCardHTML(o,enf)).join('');
  }
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
}

// Item de prenda dentro de la tarjeta 2x2 (foto real si existe, si no swatch de color)
function pitemHTML(label,tipo,p,fotoUrl){
  if(!p) return `<div class="pitem" style="opacity:0.35;">
      <div class="pitem-swatch" style="background:#333;"></div>
      <div class="pitem-body"><div class="pitem-lbl">${label}</div><div class="pitem-val">—</div></div>
    </div>`;
  const det=tipo==='calzado'?(p.marca||'')+(p.modelo?' · '+p.modelo:''):(p.marca||p.subtipo||'');
  const sub=(p.subtipo||'')+(cn(p.color)?' · '+cn(p.color):'');
  const swatch=fotoUrl
    ?`<img src="${fotoUrl}" class="pitem-swatch" alt="${label}" onerror="this.outerHTML='<div class=&quot;pitem-swatch&quot; style=&quot;background:${p.color||'#888'}&quot;></div>';">`
    :`<div class="pitem-swatch" style="background:${p.color||'#888'};"></div>`;
  return `<div class="pitem">
      ${swatch}
      <div class="pitem-body">
        <div class="pitem-lbl">${label}</div>
        <div class="pitem-val">${det||'—'}</div>
        <div class="pitem-sub">${sub}</div>
      </div>
    </div>`;
}

function outfitCardHTML(o,enf){
  const src=`${STORAGE}/outfits/${o.id}.jpg`;
  const pm=PRENDAS_MAP_CP[o.id]||{};
  const calF=pm.calzado?`${STORAGE}/calzado/${pm.calzado.codigo}.jpg`:null;
  const bolF=pm.bolso?`${STORAGE}/bolsos/${pm.bolso.codigo}.jpg`:null;
  const terF=pm.accesorio?`${STORAGE}/termos/${pm.accesorio.codigo}.jpg`:null;
  const cat=getCat(o.id);
  return `<div class="ocard">
      <div class="ocard-top">
        <img src="${src}" class="ocard-thumb" alt="${o.id}"
             onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
        <div class="ocard-thumb-placeholder" style="display:none;">
          <span style="width:8px;height:8px;border-radius:50%;background:${enf.color};"></span>
        </div>
        <div>
          <div class="ocard-id">${o.id}</div>
          <div class="ocard-cat">${cat}</div>
        </div>
      </div>
      <div class="ocard-grid">
        ${pitemHTML('Camisa','camisa',pm.camisa,sportFotoCP(pm.camisa))}
        ${pitemHTML('Pantalón','pantalon',pm.pantalon,sportFotoCP(pm.pantalon))}
        ${pitemHTML('Calzado','calzado',pm.calzado,calF)}
        ${pitemHTML('Bolso','bolso',pm.bolso,bolF)}
        ${pitemHTML('Termo','accesorio',pm.accesorio,terF)}
        ${EXTRAS_CP.filter(e=>pm[e.k]).map(e=>pitemHTML(e.k==='pulsera'?(pm.pulsera2?'Pulsera 1':'Pulsera'):e.lbl,e.k,pm[e.k],pm[e.k].codigo?`${STORAGE}/${e.folder}/${pm[e.k].codigo}.jpg`:null)).join('')}
      </div>
    </div>`;
}

function closeSheet(){
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('sheet').classList.remove('show');
}

let touchStartY=0;
document.getElementById('sheet').addEventListener('touchstart',e=>{touchStartY=e.touches[0].clientY;},{passive:true});
document.getElementById('sheet').addEventListener('touchend',e=>{
  if(e.changedTouches[0].clientY-touchStartY>60) closeSheet();
},{passive:true});

function showError(){
  document.getElementById('grid').innerHTML=`
    <div style="grid-column:1/-1;text-align:center;color:var(--mute);padding:40px 0;font-size:12px;letter-spacing:0.1em;text-transform:uppercase;">
      sin conexión
    </div>`;
}

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('/sw.js');});
}
// ── estilo: auto (casino 6:00-18:00 / rueda de noche), o fijo ──
let skinPref='auto';
try{skinPref=localStorage.getItem('cp_skin')||'auto';}catch(e){}
function skinAhora(){
  if(skinPref!=='auto') return skinPref;
  const h=new Date().getHours();
  return (h>=6&&h<18)?'casino':'rueda';
}
function aplicarSkin(){
  const sk=skinAhora(), root=document.documentElement, cambio=root.dataset.skin!==sk;
  root.dataset.skin=sk;
  const tc=document.querySelector('meta[name=theme-color]'); if(tc) tc.setAttribute('content',sk==='casino'?'#0F3B2E':'#0C0E14');
  const b=document.getElementById('skin-btn'); if(b) b.textContent=skinPref==='auto'?'auto · '+sk:sk;
  if(cambio&&lastRegulares) render(lastRegulares);
}
function cycleSkin(){
  skinPref={auto:'casino',casino:'rueda',rueda:'auto'}[skinPref]||'auto';
  try{localStorage.setItem('cp_skin',skinPref);}catch(e){}
  aplicarSkin();
}
setInterval(aplicarSkin,60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden) aplicarSkin();});
aplicarSkin();
load();
</script>
