<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Color Pop</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=Syne:wght@700;800&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --bg:#0a0a0a;--surface:#111;--border:#222;
    --text:#f0ede8;--text2:#888;
    --font-display:'Syne',sans-serif;
    --font-mono:'DM Mono',monospace;
  }
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font-mono);-webkit-font-smoothing:antialiased;overflow:hidden;}
  .app{height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);}
  header{padding:20px 24px 12px;display:flex;align-items:baseline;gap:12px;flex-shrink:0;}
  .header-title{font-family:var(--font-display);font-size:22px;font-weight:800;letter-spacing:-0.02em;}
  .header-sub{font-size:11px;color:var(--text2);letter-spacing:0.08em;text-transform:uppercase;}
  .sync-dot{width:6px;height:6px;border-radius:50%;background:#444;margin-left:auto;flex-shrink:0;transition:background 0.3s;}
  .sync-dot.ok{background:#2d9c5e;}
  .sync-dot.err{background:#c0392b;}
  .grid{flex:1;overflow-y:auto;padding:8px 16px 24px;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start;}
  .card{border-radius:16px;padding:18px 16px 16px;position:relative;overflow:hidden;cursor:pointer;transition:transform 0.15s,opacity 0.15s;min-height:110px;display:flex;flex-direction:column;justify-content:space-between;animation:fadeUp 0.4s both;}
  .card:active{transform:scale(0.97);}
  .card-bg{position:absolute;inset:0;opacity:0.15;background:var(--c);}
  .card-border{position:absolute;inset:0;border-radius:16px;border:1px solid var(--c);opacity:0.3;}
  .card-top{display:flex;align-items:flex-start;justify-content:space-between;position:relative;}
  .card-count{font-family:var(--font-display);font-size:42px;font-weight:800;line-height:1;color:var(--c);}
  .card-total{font-size:10px;color:var(--text2);letter-spacing:0.06em;margin-top:6px;text-align:right;}
  .card-name{font-family:var(--font-display);font-size:13px;font-weight:700;letter-spacing:-0.01em;position:relative;line-height:1.2;}
  .card-label{font-size:10px;color:var(--text2);letter-spacing:0.06em;margin-top:2px;position:relative;}
  .bar-wrap{margin-top:10px;height:3px;background:#222;border-radius:2px;overflow:hidden;position:relative;}
  .bar-fill{height:100%;border-radius:2px;background:var(--c);transition:width 0.8s cubic-bezier(0.16,1,0.3,1);}
  .zero .card-count{opacity:0.25;}
  .zero .card-name{opacity:0.4;}
  .loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:var(--bg);z-index:10;transition:opacity 0.4s;}
  .loading.hide{opacity:0;pointer-events:none;}
  .loading-text{font-size:12px;color:var(--text2);letter-spacing:0.1em;text-transform:uppercase;}
  .spinner{width:24px;height:24px;border:2px solid #222;border-top-color:#555;border-radius:50%;animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .total-bar{padding:12px 24px;display:flex;align-items:center;gap:12px;flex-shrink:0;border-top:1px solid var(--border);}
  .total-label{font-size:11px;color:var(--text2);letter-spacing:0.06em;text-transform:uppercase;}
  .total-val{font-family:var(--font-display);font-size:18px;font-weight:800;margin-left:auto;}
  .total-sub{font-size:11px;color:var(--text2);}
  .sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;opacity:0;pointer-events:none;transition:opacity 0.3s;}
  .sheet-overlay.show{opacity:1;pointer-events:all;}
  .sheet{position:fixed;bottom:0;left:0;right:0;background:#111;border-radius:20px 20px 0 0;z-index:101;max-height:86dvh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform 0.35s cubic-bezier(0.16,1,0.3,1);}
  .sheet.show{transform:translateY(0);}
  .sheet-handle{width:36px;height:4px;border-radius:2px;background:#333;margin:14px auto 0;flex-shrink:0;}
  .sheet-header{padding:16px 20px 12px;display:flex;align-items:center;gap:10px;flex-shrink:0;border-bottom:1px solid #1a1a1a;}
  .sheet-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .sheet-title{font-family:var(--font-display);font-size:17px;font-weight:800;letter-spacing:-0.01em;flex:1;}
  .sheet-count{font-size:12px;color:var(--text2);}
  .sheet-body{overflow-y:auto;padding:10px 16px env(safe-area-inset-bottom,24px);}
  .sheet-empty{padding:40px 20px;text-align:center;font-size:12px;color:#444;letter-spacing:0.1em;text-transform:uppercase;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}

  /* ── outfit card (sheet) ── */
  .ocard{background:var(--surface);border:1px solid #1c1c1c;border-radius:14px;padding:12px;margin-bottom:10px;}
  .ocard-top{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
  .ocard-thumb{width:42px;height:56px;border-radius:8px;object-fit:cover;background:#1a1a1a;flex-shrink:0;display:block;}
  .ocard-thumb-placeholder{width:42px;height:56px;border-radius:8px;background:#1a1a1a;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .ocard-id{font-family:var(--font-display);font-size:14px;font-weight:800;letter-spacing:-0.01em;}
  .ocard-cat{font-size:10px;color:var(--text2);letter-spacing:0.05em;text-transform:uppercase;margin-top:2px;}
  .ocard-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .pitem{background:#1a1a1a;border-radius:9px;padding:8px 9px;display:flex;align-items:center;gap:8px;min-width:0;}
  .pitem-swatch{width:20px;height:20px;border-radius:5px;object-fit:cover;flex-shrink:0;border:0.5px solid rgba(255,255,255,0.08);}
  .pitem-body{min-width:0;}
  .pitem-lbl{font-size:9px;color:var(--text2);letter-spacing:0.06em;text-transform:uppercase;}
  .pitem-val{font-size:11px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pitem-sub{font-size:10px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* ── wash cycle projection panel ── */
  .wash-panel{margin:0 16px 8px;background:var(--surface);border:1px solid var(--border);border-radius:14px;flex-shrink:0;overflow:hidden;}
  .wash-header{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;}
  .wash-days{font-family:var(--font-display);font-size:20px;font-weight:800;}
  .wash-label{font-size:11px;color:var(--text2);letter-spacing:0.04em;}
  .wash-chevron{margin-left:auto;font-size:11px;color:var(--text2);transition:transform 0.25s;}
  .wash-chevron.open{transform:rotate(180deg);}
  .wash-body{max-height:0;overflow:hidden;transition:max-height 0.3s ease;border-top:1px solid #1a1a1a;}
  .wash-body.open{max-height:340px;}
  .wash-row{display:flex;align-items:center;gap:10px;padding:9px 14px;}
  .wash-cat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .wash-cat-name{font-size:12px;font-weight:600;width:64px;flex-shrink:0;}
  .wash-cat-count{font-size:11px;color:var(--text2);flex:1;}
  .wash-status{font-size:9px;letter-spacing:0.05em;text-transform:uppercase;padding:3px 8px;border-radius:99px;flex-shrink:0;}
  .wash-status.ok{background:rgba(45,156,94,0.15);color:#4CAF7D;}
  .wash-status.tight{background:rgba(224,123,42,0.15);color:#E07B2A;}
  .wash-status.risk{background:rgba(192,57,43,0.15);color:#E0574A;}
  .wash-status.na{background:rgba(255,255,255,0.06);color:var(--text2);}
  .wash-foot{padding:8px 14px 12px;font-size:10px;color:#555;letter-spacing:0.02em;}
</style>
</head>

let allOutfits=[];

function getCat(id){return CATS[id.substring(0,2)]||'';}

let lastConfig=null, lastHistorial=[];

async function load(){
  const dot=document.getElementById('sync-dot');
  const H={'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY};
  try{
    const [rOutfits, rHistorial, rPrendas, rConfig] = await Promise.all([
      fetch(`${SB_URL}/rest/v1/outfits?select=id,usado,rating,enfoque&order=id.asc`,{headers:H}),
      fetch(`${SB_URL}/rest/v1/historial?select=outfit_id,enfoque,fecha&order=fecha.desc`,{headers:H}),
      fetch(`${SB_URL}/rest/v1/prendas?select=codigo,tipo,subtipo,marca,color,modelo,outfit_id`,{headers:H}),
      fetch(`${SB_URL}/rest/v1/config?select=ultimo_lavado,proximo_lavado,meta_dias`,{headers:H})
    ]);
    if(!rOutfits.ok) throw new Error('fetch failed');
    const rows=await rOutfits.json();
    const histRows=await rHistorial.json();
    if(!rows.length) throw new Error('no data');

    // Construir mapa outfit_id → enfoque desde historial + mapa hardcodeado como fallback
    const enfFromHist={};
    histRows.forEach(h=>{ if(!enfFromHist[h.outfit_id]) enfFromHist[h.outfit_id]=h.enfoque; });

    allOutfits=rows.map(row=>{
      const meta=OUTFITS_MAP[row.id];
      // Si no está en el mapa hardcodeado, usar el enfoque de Supabase directamente
      const e=enfFromHist[row.id]||(meta?.e)||row.enfoque||'Silver Chariot';
      return{id:row.id, usado:row.usado, nombre:meta?.nombre||row.id, e};
    }).filter(o=>o.e);
    lastHistorial=histRows;

    // PRENDAS_MAP_CP para tarjetas estructuradas
    PRENDAS_MAP_CP={};
    if(rPrendas.ok){
      const prendaRows=await rPrendas.json();
      prendaRows.forEach(p=>{
        if(!p.outfit_id) return;
        p.outfit_id.split(',').map(s=>s.trim()).filter(Boolean).forEach(oid=>{
          if(!PRENDAS_MAP_CP[oid]) PRENDAS_MAP_CP[oid]={};
          PRENDAS_MAP_CP[oid][p.tipo]={codigo:p.codigo,subtipo:p.subtipo,marca:p.marca,color:p.color,modelo:p.modelo};
        });
      });
    }

    // Config de ciclo de lavado
    if(rConfig.ok){
      const cfgRows=await rConfig.json();
      lastConfig=cfgRows[0]||null;
    }

    dot.className='sync-dot ok';
    render(allOutfits);
    renderWash(allOutfits, lastHistorial, lastConfig);
  }catch(e){
    dot.className='sync-dot err';
    showError();
  }
  document.getElementById('loading').classList.add('hide');
}

function render(outfits){
  const disp={},total={};
  Object.keys(ENFOQUES).forEach(e=>{disp[e]=0;total[e]=0;});
  outfits.forEach(o=>{
    if(!ENFOQUES[o.e]) return;
    total[o.e]=(total[o.e]||0)+1;
    if(!o.usado) disp[o.e]=(disp[o.e]||0)+1;
  });
  const totalDisp=Object.values(disp).reduce((a,b)=>a+b,0);
  const totalAll=outfits.length;
  const sorted=Object.keys(ENFOQUES).sort((a,b)=>disp[b]-disp[a]);
  const grid=document.getElementById('grid');
  grid.innerHTML=sorted.map((e,i)=>{
    const c=ENFOQUES[e].color;
    const d=disp[e]||0;
    const t=total[e]||0;
    const pct=t>0?Math.round((d/t)*100):0;
    return`<div class="card${d===0?' zero':''}" style="--c:${c};animation-delay:${i*0.04}s" onclick="openSheet('${e.replace(/'/g,"\\'")}')">
      <div class="card-bg"></div>
      <div class="card-border"></div>
      <div class="card-top">
        <div class="card-count">${d}</div>
        <div class="card-total">${t} total<br>${pct}%</div>
      </div>
      <div>
        <div class="card-name">${e}</div>
        <div class="card-label">${ENFOQUES[e].label}</div>
        <div class="bar-wrap">
          <div class="bar-fill" style="width:${pct}%"></div>
        </div>
      </div>
    </div>`;
  }).join('');
  document.getElementById('total-bar').style.display='flex';
  document.getElementById('total-val').textContent=totalDisp;
  document.getElementById('total-sub').textContent=`de ${totalAll} outfits`;
}

// ── proyección de ciclo de lavado ──
let washOpen=false;

function diffDias(a,b){ // a,b: 'YYYY-MM-DD' → días (a-b)
  const da=new Date(a+'T00:00:00'), db=new Date(b+'T00:00:00');
  return Math.round((da-db)/86400000);
}

function renderWash(outfits, historial, cfg){
  const panel=document.getElementById('wash-panel');
  if(!cfg||!cfg.ultimo_lavado){ panel.style.display='none'; return; }
  panel.style.display='block';

  const hoy=new Date().toISOString().slice(0,10);
  const metaDias=cfg.meta_dias||20;
  const proximo=cfg.proximo_lavado||null;
  const diasRestantes=Math.max(0, proximo?diffDias(proximo,hoy):(metaDias-diffDias(hoy,cfg.ultimo_lavado)));
  const diasTranscurridos=Math.max(1, diffDias(hoy,cfg.ultimo_lavado));

  document.getElementById('wash-days').textContent=diasRestantes;
  document.getElementById('wash-label').textContent=diasRestantes===1?'día para lavar':'días para lavar';
  document.getElementById('wash-days').style.color=diasRestantes<=3?'#E0574A':diasRestantes<=7?'#E07B2A':'var(--text)';

  // disponibles/total por categoría
  const catStats={};
  Object.keys(CATS).forEach(c=>catStats[c]={disp:0,total:0,usosCiclo:0});
  outfits.forEach(o=>{
    const c=o.id.substring(0,2);
    if(!catStats[c]) return;
    catStats[c].total++;
    if(!o.usado) catStats[c].disp++;
  });
  historial.forEach(h=>{
    if(!h.fecha||h.fecha<cfg.ultimo_lavado) return;
    const c=(h.outfit_id||'').substring(0,2);
    if(catStats[c]) catStats[c].usosCiclo++;
  });

  const body=document.getElementById('wash-body');
  body.innerHTML=Object.keys(CATS).map(c=>{
    const s=catStats[c];
    const tasaDia=s.usosCiclo/diasTranscurridos;
    const proyeccion=Math.ceil(tasaDia*diasRestantes);
    let statusClass='na', statusLbl='sin datos';
    if(s.usosCiclo>0){
      if(s.disp>=proyeccion){ statusClass='ok'; statusLbl='alcanza'; }
      else if(s.disp>=proyeccion*0.5){ statusClass='tight'; statusLbl='ajustado'; }
      else{ statusClass='risk'; statusLbl='no alcanza'; }
    }
    return `<div class="wash-row">
        <span class="wash-cat-dot" style="background:${CATS_COLOR[c]}"></span>
        <span class="wash-cat-name">${CATS[c]}</span>
        <span class="wash-cat-count">${s.disp}/${s.total} disp${s.usosCiclo>0?` · ~${proyeccion} proy.`:''}</span>
        <span class="wash-status ${statusClass}">${statusLbl}</span>
      </div>`;
  }).join('');
  body.innerHTML+=`<div class="wash-foot">estimado según uso desde el último lavado (${cfg.ultimo_lavado})</div>`;
}

function toggleWash(){
  washOpen=!washOpen;
  document.getElementById('wash-body').classList.toggle('open',washOpen);
  document.getElementById('wash-chevron').classList.toggle('open',washOpen);
}

function openSheet(enfoque){
  const enf=ENFOQUES[enfoque];
  if(!enf) return;
  const disponibles=allOutfits.filter(o=>o.e===enfoque&&!o.usado);
  document.getElementById('sheet-dot').style.background=enf.color;
  document.getElementById('sheet-title').textContent=enfoque;
  document.getElementById('sheet-count').textContent=`${disponibles.length} disponibles`;
  const body=document.getElementById('sheet-body');
  if(!disponibles.length){
    body.innerHTML=`<div class="sheet-empty">sin outfits disponibles</div>`;
  } else {
    body.innerHTML=disponibles.map(o=>outfitCardHTML(o,enf)).join('');
  }
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
}

// Item de prenda dentro de la tarjeta 2x2 (foto real si existe, si no swatch de color)
function pitemHTML(label,tipo,p,fotoUrl){
  if(!p) return `<div class="pitem" style="opacity:0.35;">
      <div class="pitem-swatch" style="background:#333;"></div>
      <div class="pitem-body"><div class="pitem-lbl">${label}</div><div class="pitem-val">—</div></div>
    </div>`;
  const det=tipo==='calzado'?(p.marca||'')+(p.modelo?' · '+p.modelo:''):(p.marca||p.subtipo||'');
  const sub=(p.subtipo||'')+(cn(p.color)?' · '+cn(p.color):'');
  const swatch=fotoUrl
    ?`<img src="${fotoUrl}" class="pitem-swatch" alt="${label}" onerror="this.outerHTML='<div class=&quot;pitem-swatch&quot; style=&quot;background:${p.color||'#888'}&quot;></div>';">`
    :`<div class="pitem-swatch" style="background:${p.color||'#888'};"></div>`;
  return `<div class="pitem">
      ${swatch}
      <div class="pitem-body">
        <div class="pitem-lbl">${label}</div>
        <div class="pitem-val">${det||'—'}</div>
        <div class="pitem-sub">${sub}</div>
      </div>
    </div>`;
}

function outfitCardHTML(o,enf){
  const src=`${STORAGE}/outfits/${o.id}.jpg`;
  const pm=PRENDAS_MAP_CP[o.id]||{};
  const calF=pm.calzado?`${STORAGE}/calzado/${pm.calzado.codigo}.jpg`:null;
  const bolF=pm.bolso?`${STORAGE}/bolsos/${pm.bolso.codigo}.jpg`:null;
  const terF=pm.accesorio?`${STORAGE}/termos/${pm.accesorio.codigo}.jpg`:null;
  const cat=getCat(o.id);
  return `<div class="ocard">
      <div class="ocard-top">
        <img src="${src}" class="ocard-thumb" alt="${o.id}"
             onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
        <div class="ocard-thumb-placeholder" style="display:none;">
          <span style="width:8px;height:8px;border-radius:50%;background:${enf.color};"></span>
        </div>
        <div>
          <div class="ocard-id">${o.id}</div>
          <div class="ocard-cat">${cat}</div>
        </div>
      </div>
      <div class="ocard-grid">
        ${pitemHTML('Camisa','camisa',pm.camisa,null)}
        ${pitemHTML('Pantalón','pantalon',pm.pantalon,null)}
        ${pitemHTML('Calzado','calzado',pm.calzado,calF)}
        ${pitemHTML('Bolso','bolso',pm.bolso,bolF)}
        ${pitemHTML('Termo','accesorio',pm.accesorio,terF)}
      </div>
    </div>`;
}

function closeSheet(){
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('sheet').classList.remove('show');
}

let touchStartY=0;
document.getElementById('sheet').addEventListener('touchstart',e=>{touchStartY=e.touches[0].clientY;},{passive:true});
document.getElementById('sheet').addEventListener('touchend',e=>{
  if(e.changedTouches[0].clientY-touchStartY>60) closeSheet();
},{passive:true});

function showError(){
  document.getElementById('grid').innerHTML=`
    <div style="grid-column:1/-1;text-align:center;color:#555;padding:40px 0;font-size:12px;letter-spacing:0.1em;text-transform:uppercase;">
      sin conexión
    </div>`;
}

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('/sw.js');});
}
load();
</script>
